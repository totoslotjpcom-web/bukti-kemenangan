<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Winner Member</title>
  <link rel="icon" href="" data-favicon>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<header class="header">
  <div class="container header-inner">
    <img class="logo" data-logo alt="Logo">
    <nav class="nav">
      <a class="btn secondary" href="/">Beranda</a>
      <a class="btn" href="https://cutt.ly/rtp-totoslotjp" target="_blank" rel="noopener">RTP SLOT GACOR HARI INI</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="container hero-inner">
      <div class="eyebrow">GALERI RESMI MEMBER</div>
      <h1 data-site-name>WINNER MEMBER</h1>
      <p data-tagline>Galeri Bukti Kemenangan Member</p>
    </div>
  </section>

  <section class="container winners" id="winners">
    <div class="toolbar">
      <input id="search" class="input" placeholder="Cari username, game, atau judul...">
      <a class="btn rtp-button" href="https://cutt.ly/rtp-totoslotjp" target="_blank" rel="noopener">RTP SLOT GACOR HARI INI</a>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty hidden">Belum ada posting kemenangan.</div>
    <div id="pagination" class="pagination"></div>
  </section>
</main>

<footer class="footer"><div class="container">© <span id="year"></span> <span data-site-name></span>. All rights reserved.</div></footer>

<script src="/config.js"></script>
<script>
const CFG = window.SITE_CONFIG || {};
const esc = s => String(s ?? "").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money = n => (CFG.currencyPrefix || "Rp") + " " + Number(n || 0).toLocaleString("id-ID");
const fmt = d => d ? new Date(d).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"}) : "";
document.getElementById("year").textContent = new Date().getFullYear();
document.querySelectorAll("[data-site-name]").forEach(x=>x.textContent=CFG.siteName||"WINNER MEMBER");
document.querySelectorAll("[data-tagline]").forEach(x=>x.textContent=CFG.tagline||"Galeri Bukti Kemenangan Member");
document.querySelectorAll("[data-logo]").forEach(x=>{ if(CFG.logoUrl)x.src=CFG.logoUrl; else x.style.display="none"; });
document.querySelectorAll("[data-favicon]").forEach(x=>{ if(CFG.faviconUrl)x.href=CFG.faviconUrl; });
if(CFG.backgroundUrl) document.documentElement.style.setProperty("--site-bg",`url("${CFG.backgroundUrl}")`);

let page=1, timer;
const grid=document.getElementById("grid"), empty=document.getElementById("empty"), pager=document.getElementById("pagination");

async function load(){
  const q=document.getElementById("search").value.trim();
  const u=new URL("/api/posts",location.origin);
  u.searchParams.set("page",page);
  u.searchParams.set("limit",CFG.postsPerPage||12);
  if(q)u.searchParams.set("q",q);
  try{
    const r=await fetch(u,{cache:"no-store"});
    const d=await r.json();
    const posts=d.posts||[];
    grid.innerHTML=posts.map(p=>`
      <article class="card">
        <a class="card-image-link" href="/winner.html?slug=${encodeURIComponent(p.slug)}">
          <img class="card-image" src="${esc(p.banner_url||p.image_url||"")}" alt="${esc(p.title||"Bukti kemenangan")}" loading="lazy">
        </a>
        <div class="card-body">
          <div class="card-label">KEMENANGAN TOTAL</div>
          <div class="card-amount">${money(p.amount)}</div>
          <h2 class="card-title">${esc(p.title||"Bukti Kemenangan")}</h2>
          <div class="card-meta"><strong>${esc(p.username||"-")}</strong><span>${esc(p.game||"-")}</span></div>
          <div class="card-footer">
            <span>${fmt(p.published_at||p.created_at)}</span>
            <a class="detail-link" href="/winner.html?slug=${encodeURIComponent(p.slug)}">LIHAT DETAIL ›</a>
          </div>
        </div>
      </article>`).join("");
    empty.classList.toggle("hidden",posts.length>0);
    const total=Number(d.total||posts.length), limit=Number(CFG.postsPerPage||12), pages=Math.max(1,Math.ceil(total/limit));
    pager.innerHTML="";
    if(pages>1) for(let i=1;i<=pages;i++){
      const b=document.createElement("button"); b.className="btn small "+(i===page?"":"secondary"); b.textContent=i;
      b.onclick=()=>{page=i;load();scrollTo({top:document.getElementById("winners").offsetTop-80,behavior:"smooth"});}; pager.appendChild(b);
    }
  }catch(e){
    grid.innerHTML=""; empty.textContent="Gagal memuat posting."; empty.classList.remove("hidden");
  }
}
document.getElementById("search").addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(()=>{page=1;load()},300)});
load();
</script>
</body>
</html>
